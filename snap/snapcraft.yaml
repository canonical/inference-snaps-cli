name: stack-utils
base: core24
version: git
summary: Utilities for selecting hardware optimised engines
description: |
  These utilities help decide which components should be installed on a particular system.

grade: devel
confinement: strict

plugs:
  intel-npu:
    interface: custom-device
    custom-device: intel-npu-device
  npu-libs:
    interface: content
    content: npu-libs-2404
    target: $SNAP/npu-libs

layout:
  # OpenCL looks in /etc/OpenCL/vendors for .icd files containing the paths to shared objects
  /etc/OpenCL/vendors:
    bind: $SNAP/etc/OpenCL/vendors
  # Intel icd files use an absolute path to Intel OpenCL shared objects. Use a layout to mount the so files at the expected location
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl
  # NVIDIA icd specifies only the shared object name: libnvidia-opencl.so.1
  # libnvidia-opencl.so.1 is inside /snap/stack-utils/x3/usr/lib/x86_64-linux-gnu/, which is already in LD_LIBRARY_PATH

parts:
  system-utilities:
    plugin: nil
    stage-packages:
      - pciutils

  nvidia-smi:
    plugin: nil
    build-packages:
      - nvidia-utils-580
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cp /usr/bin/nvidia-smi $CRAFT_PART_INSTALL/usr/bin/
      
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580/
      mkdir -p $license_dir
      cp /usr/share/doc/nvidia-utils-580/copyright $license_dir/

  opencl:
    # Include OpenCL runtime and clinfo for looking up vRAM on Intel GPUs
    plugin: nil
    stage-packages:
      - clinfo
    build-packages:
      - wget
    override-build: |
      # Only install intel opencl drivers on amd64
      if [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ]; then
        # Legacy Intel OpenCL Runtime
        mkdir -p $CRAFT_PART_BUILD/opencl-intel-legacy1
        cd $CRAFT_PART_BUILD/opencl-intel-legacy1
        wget https://github.com/intel/compute-runtime/releases/download/24.35.30872.36/intel-level-zero-gpu-legacy1_1.5.30872.36_amd64.deb
        wget https://github.com/intel/compute-runtime/releases/download/24.35.30872.36/intel-opencl-icd-legacy1_24.35.30872.36_amd64.deb
        dpkg --root=$CRAFT_PART_INSTALL --force-all -i *.deb
      
        # Recent Intel OpenCL Runtime
        mkdir -p $CRAFT_PART_BUILD/opencl-intel
        cd $CRAFT_PART_BUILD/opencl-intel
        wget https://github.com/intel/intel-graphics-compiler/releases/download/v2.5.6/intel-igc-core-2_2.5.6+18417_amd64.deb
        wget https://github.com/intel/intel-graphics-compiler/releases/download/v2.5.6/intel-igc-opencl-2_2.5.6+18417_amd64.deb
        wget https://github.com/intel/compute-runtime/releases/download/24.52.32224.5/intel-level-zero-gpu_1.6.32224.5_amd64.deb
        wget https://github.com/intel/compute-runtime/releases/download/24.52.32224.5/intel-opencl-icd_24.52.32224.5_amd64.deb
        wget https://github.com/intel/compute-runtime/releases/download/24.52.32224.5/libigdgmm12_22.5.5_amd64.deb
        dpkg --root=$CRAFT_PART_INSTALL --force-all -i *.deb
        
        # Two symlinks are created by installing opencl: 
        # etc/alternatives/ocloc -> /usr/bin/ocloc-24.52.1, usr/bin/ocloc -> /etc/alternatives/ocloc
        # These point to outside of the snap and fail store review. They are not required, so remove them:
        rm $CRAFT_PART_INSTALL/etc/alternatives/ocloc
        rm $CRAFT_PART_INSTALL/usr/bin/ocloc
      
        cd $CRAFT_PART_BUILD
      fi # End of intel-opencl driver installation
      
      craftctl default
  component-local-files:
    plugin: dump
    source: components
    organize:
      "cpu-devel-component/*": (component/cpu-devel-component)
      "cuda-component/*": (component/cuda-component)
      "example-memory-component/*": (component/example-memory-component)
      "llamaaio/*": (component/llamaaio)
      "llamacpp/*": (component/llamacpp)
      "model-distill-qwen-1-5b-q8-0-gguf/*": (component/model-distill-qwen-1-5b-q8-0-gguf)
      "model-q4-k-m-gguf/*": (component/model-q4-k-m-gguf)
      # Add other components here
    prime:
      # Exclude everything not explicitly organized
      - -*
  cpu-devel-component:
    plugin: dump
    source: components/cpu-devel-component
    organize:
      "*": components/cpu-devel-component/
  cuda-component:
    plugin: dump
    source: components/cuda-component
    organize:
      "*": components/cuda-component/
  example-memory-component:
    plugin: dump
    source: components/example-memory-component
    organize: 
      "*": components/example-memory-component/
  llamaaio:
    plugin: dump
    source: components/llamaaio
    organize:
      "*": components/llamaaio/
  llamacpp:
    plugin: dump
    source: components/llamacpp
    organize:
      "*": components/llamacpp/
  model-distill-qwen-1-5b-q8-0-gguf:
    plugin: dump
    source: components/model-distill-qwen-1-5b-q8-0-gguf
    organize:
      "*": components/model-distill-qwen-1-5b-q8-0-gguf/
  model-q4-k-m-gguf:
    plugin: dump
    source: components/model-q4-k-m-gguf
    organize:
      "*": components/model-q4-k-m-gguf/

  # To use `version: git` in this file, we require git as a build dependency.
  # This is fixed but not published yet. See https://github.com/canonical/snapcraft/issues/4944
  git:
    plugin: nil
    build-packages:
      - git

  go-clis:
    plugin: go
    build-snaps:
      - go/1.24/stable
    source: .
    source-type: local

  engines:
    plugin: dump
    source: test_data/engines
    organize:
      "*": engines/
components:
  cpu-devel-component: &test-component
    type: standard
    summary: Just a test component
    description: Component for testing purposes
  cuda-component:
    <<: *test-component
  example-memory-component:
    <<: *test-component
  llamaaio:
    <<: *test-component
  llamacpp:
    <<: *test-component
  model-distill-qwen-1-5b-q8-0-gguf:
    <<: *test-component
  model-q4-k-m-gguf:
    <<: *test-component
      
apps:
  stack-utils:
    plugs:
      - hardware-observe
      - home
      - network
      - opengl
    command: bin/cli

  clinfo:
    plugs:
      - hardware-observe
      - opengl
      - network
    command: usr/bin/clinfo

  nvidia-smi:
    plugs:
      - hardware-observe
      - opengl
    command: usr/bin/nvidia-smi
