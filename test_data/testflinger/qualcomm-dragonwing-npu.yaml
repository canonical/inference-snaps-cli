job_queue: qualcomm-rb4-qcs8275-c38153

provision_data:
  skip: true

test_data:
  test_cmds: |
    set -euxo pipefail

    export DEBIAN_FRONTEND=noninteractive
    sudo apt-get update
    sudo apt-get install -y git jq curl ca-certificates

    WORKDIR="$HOME/inference-snaps-cli"
    rm -rf "$WORKDIR"
    git clone https://github.com/canonical/inference-snaps-cli.git "$WORKDIR"
    cd "$WORKDIR"

    # Optional: apply your unpushed local changes as a base64-encoded git patch.
    # Replace __LOCAL_PATCH_B64__ with: git diff --binary | base64 -w0
    LOCAL_PATCH_B64=''

    if [ -n "$LOCAL_PATCH_B64" ] && [ "$LOCAL_PATCH_B64" != '__LOCAL_PATCH_B64__' ]; then
      printf '%s' "$LOCAL_PATCH_B64" | base64 -d > /tmp/local.patch

      # Ensure parent directories for new/renamed files exist before apply --check.
      awk '/^\+\+\+ b\// { print substr($2, 3) }' /tmp/local.patch \
        | grep -v '^/dev/null$' \
        | xargs -r -n1 dirname \
        | sort -u \
        | xargs -r mkdir -p

      git apply --check /tmp/local.patch
      git apply /tmp/local.patch
    else
      echo "No local patch embedded; running against repository HEAD"
    fi

    # Try to use existing Go first (so tests can work even with older versions)
    if command -v go &> /dev/null; then
      echo "Go already installed: $(go version)"
      export PATH="$(go env GOROOT)/bin:$PATH"
    else
      echo "Go not found, attempting to install..."
      GO_VERSION_RAW="$(awk '/^go /{print $2; exit}' go.mod)"
      case "$GO_VERSION_RAW" in
        *.*.*) GO_VERSION="$GO_VERSION_RAW" ;;
        *.*) GO_VERSION="${GO_VERSION_RAW}.0" ;;
        *) echo "Unsupported go.mod version format: $GO_VERSION_RAW"; exit 1 ;;
      esac

      case "$(uname -m)" in
        x86_64) GO_ARCH="amd64" ;;
        aarch64|arm64) GO_ARCH="arm64" ;;
        *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
      esac

      GO_TARBALL="go${GO_VERSION}.linux-${GO_ARCH}.tar.gz"
      
      # Try multiple download URLs with fallback strategy
      declare -a URLS=(
        "https://go.dev/dl/${GO_TARBALL}"
        "https://golang.google.cn/dl/${GO_TARBALL}"
        "https://mirror.ghproxy.com/https://github.com/golang/go/releases/download/go${GO_VERSION}/${GO_TARBALL}"
      )
      
      DOWNLOADED=0
      for URL in "${URLS[@]}"; do
        echo "Attempting to download from: $URL"
        if curl --connect-timeout 5 --max-time 60 -fsSLo "/tmp/${GO_TARBALL}" "$URL"; then
          echo "Successfully downloaded Go from $URL"
          DOWNLOADED=1
          break
        fi
        echo "Failed to download from $URL, trying next..."
      done
      
      if [ $DOWNLOADED -eq 0 ]; then
        echo "WARNING: Could not download Go $GO_VERSION. Attempting to use system Go..."
        if sudo apt-get install -y golang-go; then
          echo "Installed system Go via apt"
          export PATH="$(go env GOROOT)/bin:$PATH"
        else
          echo "ERROR: Could not install Go by any method"
          exit 1
        fi
      else
        sudo rm -rf /usr/local/go
        sudo tar -C /usr/local -xzf "/tmp/${GO_TARBALL}"
        export PATH="/usr/local/go/bin:$PATH"
      fi
    fi

    go version

    go build -o inference-snaps-cli ./cmd/cli

    # Strict diagnostic: verify this job is really executing on the expected DUT.
    echo "=== SYSTEM DIAGNOSTICS ==="
    echo "Host: $(hostname)"
    echo "Kernel: $(uname -r)"
    echo "Arch: $(uname -m)"
    [ -f /etc/os-release ] && cat /etc/os-release
    if [ -f /sys/firmware/devicetree/base/model ]; then
      echo "Device-tree model:"
      tr -d '\000' < /sys/firmware/devicetree/base/model || true
    fi
    if [ -f /proc/device-tree/model ]; then
      echo "Proc device-tree model:"
      tr -d '\000' < /proc/device-tree/model || true
    fi
    echo "=========================="
    echo ""

    # Hard fail if this is not an ARM DUT. Earlier failures showed x86_64/kvm runs.
    case "$(uname -m)" in
      aarch64|arm64) ;;
      *)
        echo "ERROR: Job is not running on an ARM Qualcomm DUT (arch=$(uname -m))."
        echo "ERROR: This indicates wrong queue allocation or wrong execution environment."
        exit 2
        ;;
    esac

    # 1) Wait for real FastRPC nodes to appear (no mock nodes).
    echo "Waiting for /dev/fastrpc-* nodes (up to 90s)..."
    FASTRPC_FOUND=0
    for _ in $(seq 1 30); do
      if ls -1 /dev/fastrpc-* >/dev/null 2>&1; then
        FASTRPC_FOUND=1
        break
      fi
      sleep 3
    done

    if [ "$FASTRPC_FOUND" -ne 1 ]; then
      echo "ERROR: No /dev/fastrpc-* nodes found after waiting."
      echo "Listing /dev entries that might be relevant:"
      ls -1 /dev | grep -Ei 'fastrpc|cdsp|adsp|qcom|dsp' || true
      echo "Loaded modules mentioning fastrpc:"
      if command -v lsmod >/dev/null 2>&1; then
        lsmod | grep -i fastrpc || true
      else
        grep -i fastrpc /proc/modules || true
      fi
      exit 3
    fi

    echo "FastRPC nodes found:"
    ls -1 /dev/fastrpc-*
    ls -1 /dev/fastrpc-cdsp* || true

    # 2) Verify machine info contains Qualcomm Dragonwing and NPU/FastRPC entries.
    echo ""
    echo "=== MACHINE INFO TEST ==="
    # Some DUT images do not include snapd preinstalled; ensure expected path exists.
    sudo mkdir -p /var/lib/snapd/snaps
    ./inference-snaps-cli show-machine --format=json > /tmp/hardware-info.json
    echo "Machine info (first 80 lines):"
    head -80 /tmp/hardware-info.json

    # Strict assertions: on a real DUT with FastRPC nodes, these must be present.
    jq -e '.platforms | map(select(.vendor == "qualcomm" and .name == "dragonwing")) | length > 0' /tmp/hardware-info.json
    jq -e '.devices | map(select(.type == "npu" and .bus == "fastrpc")) | length > 0' /tmp/hardware-info.json
    jq -e '.devices[] | select(.type == "npu" and .bus == "fastrpc") | .nodes | length > 0' /tmp/hardware-info.json
    echo "Machine detection checks passed."

    # 3) Verify selector can match an NPU engine using the new fastrpc bus.
    echo ""
    echo "=== SELECTOR MATCHING TEST ==="
    mkdir -p /tmp/engines/qualcomm-npu-smoke
    cat > /tmp/engines/qualcomm-npu-smoke/engine.yaml << 'ENGINE_EOF'
    name: qualcomm-npu-smoke
    description: Smoke test engine for Qualcomm Dragonwing NPU detection
    vendor: Canonical
    grade: stable
    devices:
      anyof:
        - type: npu
          bus: fastrpc
    ENGINE_EOF

    echo "Running selector with NPU engine..."
    ./inference-snaps-cli show-machine --format=json | ./inference-snaps-cli debug select-engine --engines /tmp/engines > /tmp/select-engine.out 2>&1
    echo "Selector output:"
    cat /tmp/select-engine.out
    
    grep -q "qualcomm-npu-smoke" /tmp/select-engine.out
    echo "Selector matched NPU engine."

    echo ""
    echo "=== TEST SUMMARY ==="
    echo "Go toolchain configured"
    echo "inference-snaps-cli built successfully"
    echo "Machine detection validated on real FastRPC nodes"
    echo "Selector matching validated"
    echo ""
    echo "Qualcomm Dragonwing NPU detection implementation validated."
reserve_data:
  ssh_keys:
    - "lp:sinan-k"
  timeout: 5h